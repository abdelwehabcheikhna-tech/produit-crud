# Spring Boot Prod Profile
spring.application.name=produit-prod

# Server
server.port=${PORT:8080}

# MySQL Database - Railway gives these variables automatically
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/produit?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA with MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Session
server.servlet.session.persistent=false
server.servlet.session.timeout=30m

# Logging
logging.level.com.produit.produit=INFO
logging.level.org.springframework.web=WARN

# Thymeleaf
spring.thymeleaf.cache=true
