<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head">
    <title>Formulaire Produit</title>
</head>
<body>
<div th:replace="layout :: navigation"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${produit.id == null ? '➕ Ajouter un produit' : '✏️ Modifier un produit'}">
                        Formulaire
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/produits/save}" th:object="${produit}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom du produit *</label>
                            <input type="text" th:field="*{nom}" class="form-control" id="nom"
                                   placeholder="Ex: Ordinateur portable" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" id="description" rows="3"
                                      placeholder="Ex: Portable Lenovo avec 16GB RAM"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="prix" class="form-label">Prix *</label>
                            <div class="input-group">
                                <input type="number" step="0.01" th:field="*{prix}" class="form-control" id="prix"
                                       placeholder="750.00" required>
                                <span class="input-group-text">MRU</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-success">
                                💾 Enregistrer
                            </button>
                            <a th:href="@{/produits}" class="btn btn-secondary">
                                ❌ Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="layout :: scripts"></div>
</body>
</html>
