<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout :: head">
    <title>Gestion des Produits</title>
</head>
<body>
<div th:replace="layout :: navigation"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📦 Gestion des Produits</h2>
        <a class="btn btn-primary" th:href="@{/produits/add}">
            ➕ Ajouter un produit
        </a>
    </div>

    <!-- Message de succès -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tableau Bootstrap -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Nom</th>
                <th>Description</th>
                <th>Prix (MRU)</th>
                <th>Actions</th>
                </td>
            </thead>
            <tbody>
            <tr th:each="p : ${produits}">
                <td th:text="${p.nom}"></td>
                <td th:text="${p.description}"></td>
                <td th:text="${p.prix}"></td>
                <td>
                    <a class="btn btn-warning btn-sm me-1" th:href="@{'/produits/edit/' + ${p.id}}">
                        ✏️ Modifier
                    </a>
                    <a class="btn btn-danger btn-sm" th:href="@{'/produits/delete/' + ${p.id}}"
                       onclick="return confirm('⚠️ Voulez-vous vraiment supprimer ce produit ?');">
                        🗑️ Supprimer
                    </a>
                </td>
            </tr>
            </tr>
            <tr th:if="${produits.isEmpty()}">
                <td colspan="4" class="text-center text-muted">
                    Aucun produit disponible. Cliquez sur "Ajouter" pour en créer.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="layout :: scripts"></div>
</body>
</html>
