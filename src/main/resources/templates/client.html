<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout :: head">
  <title>Espace Client</title>
</head>
<body>
<div th:replace="layout :: navigation"></div>

<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <div class="alert alert-info">
        <h4>👋 Bienvenue, <span sec:authentication="name">Client</span> !</h4>
        <p>Découvrez nos produits ci-dessous et ajoutez-les à votre panier.</p>
      </div>
    </div>
  </div>

  <h2>🛍️ Nos Produits</h2>

  <div class="row">
    <div th:each="p : ${produits}" class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title" th:text="${p.nom}">Produit</h5>
          <p class="card-text text-muted" th:text="${p.description}">Description</p>
          <h4 class="text-primary" th:text="${p.prix} + ' MRU'">Prix</h4>
        </div>
        <div class="card-footer bg-transparent">
          <a class="btn btn-success w-100" th:href="@{'/panier/add/' + ${p.id}}">
            🛒 Ajouter au panier
          </a>
        </div>
      </div>
    </div>

    <div th:if="${produits.isEmpty()}" class="col-12">
      <div class="alert alert-warning text-center">
        Aucun produit n'est disponible pour le moment.
      </div>
    </div>
  </div>
</div>

<div th:replace="layout :: scripts"></div>
</body>
</html>
