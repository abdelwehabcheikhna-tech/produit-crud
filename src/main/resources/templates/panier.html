<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mon Panier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>🛒 Mon Panier</h2>

<!-- Affichage des messages -->
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <strong>❌ Erreur !</strong> <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <strong>✅ Succès !</strong> <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${panier.isEmpty()}" class="alert alert-info">
    📦 Votre panier est vide.
    <a th:href="@{/catalogue}" class="alert-link">Continuer vos achats</a>
</div>

<div th:unless="${panier.isEmpty()}">
    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>Produit</th>
                <th>Description</th>
                <th>Prix unitaire</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${panier}">
                <td th:text="${item.nom}"></td>
                <td th:text="${item.description}"></td>
                <td th:text="${item.prix} + ' MRU'"></td>
                <td>
                    <a th:href="@{'/panier/remove/' + ${item.id}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Retirer ce produit du panier ?')">
                        🗑️ Retirer
                    </a>
                </td>
            </tr>
            </tbody>
            <tfoot class="table-info">
            <tr>
                <td colspan="2"><strong>Total</strong></td>
                <td colspan="2"><strong th:text="${total} + ' MRU'"></strong></td>
            </tr>
            </tfoot>
        </table>
    </div>

    <div class="mt-4 d-flex gap-2">
        <!-- Formulaire de validation -->
        <form th:action="@{/commande/valider}" method="post"
              onsubmit="return confirm('Confirmer votre commande ?')">
            <button type="submit" class="btn btn-success btn-lg">
                ✅ Valider la commande
            </button>
        </form>

        <a th:href="@{/panier/clear}" class="btn btn-danger btn-lg"
           onclick="return confirm('Vider tout le panier ?')">
            🗑️ Vider le panier
        </a>

        <a th:href="@{/catalogue}" class="btn btn-primary btn-lg">
            🛍️ Continuer mes achats
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
