<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmation de commande</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white text-center">
                <h3>✅ Commande validée avec succès !</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <strong>Merci pour votre achat !</strong> Votre commande a été enregistrée.
                </div>

                <h4>Détails de la commande n° <span th:text="${commande.id}"></span></h4>

                <hr>

                <h5>Produits commandés :</h5>
                <ul>
                    <li th:each="p : ${commande.produits}"
                        th:text="${p.nom} + ' - ' + ${p.prix} + ' MRU'">
                    </li>
                </ul>

                <hr>

                <h3 class="text-primary">Total à payer : <span th:text="${commande.total} + ' MRU'"></span></h3>
            </div>
            <div class="card-footer text-center">
                <a th:href="@{/catalogue}" class="btn btn-primary">Continuer mes achats</a>
                <a th:href="@{/client}" class="btn btn-secondary">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
