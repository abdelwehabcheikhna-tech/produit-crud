<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titre}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 2rem 0;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2 class="form-title" th:text="${titre}"></h2>

    <form th:action="${produit.id != null} ? @{/admin/produits/modifier/{id}(id=${produit.id})} : @{/admin/produits/ajouter}"
          th:object="${produit}" method="post">

        <div class="form-group">
            <label>Nom du produit</label>
            <input type="text" th:field="*{nom}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>Prix (MRU)</label>
            <input type="number" step="0.01" th:field="*{prix}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number" th:field="*{stock}" class="form-control">
        </div>

        <div class="form-group">
            <label>URL Image</label>
            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://exemple.com/image.jpg">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" th:field="*{disponible}"> Produit disponible
            </label>
        </div>

        <button type="submit" class="btn-submit">Enregistrer</button>
        <a th:href="@{/admin/produits}" class="btn-cancel">Annuler</a>
    </form>
</div>
</body>
</html>
