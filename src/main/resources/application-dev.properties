# Developpement local avec MySQL
spring.application.name=produit-dev
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/produit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.persistent=false
logging.level.com.produit.produit=DEBUG
spring.thymeleaf.cache=false